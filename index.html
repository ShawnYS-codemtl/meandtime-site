<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>me and time</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0b0b0d;
        --card: #141416;
        --text: #ececed;
        --muted: #9a9aa0;
        --rule: #26262a;
        --accent: #d9b8a8;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main { max-width: 34rem; padding: 3rem 1.5rem; text-align: center; }
      .app-icon {
        width: 96px;
        height: 96px;
        border-radius: 22.5%;
        margin: 0 auto 1.6rem;
        display: block;
        border: 1px solid var(--rule);
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0 0 1rem;
      }
      h1 { font-size: 2.4rem; font-weight: 600; margin: 0 0 0.8rem; }
      p { color: var(--muted); margin: 0 auto 2.2rem; max-width: 26rem; }
      .links { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      .links a {
        display: inline-block;
        padding: 0.7rem 1.3rem;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        text-decoration: none;
      }
      .links a:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <img class="app-icon" src="icon.png" width="96" height="96" alt="me and time app icon" />
      <p class="eyebrow">me and time</p>
      <h1>A quiet diary of your face over time.</h1>
      <p>
        Take a selfie now and then; scrub back through the months and watch yourself slowly
        change. Private by default — everything stays on your device.
      </p>
      <div class="links">
        <a href="support.html">Support</a>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </main>
  </body>
</html>
